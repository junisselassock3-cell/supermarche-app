<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Super Marché Moderne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lien vers le JS externe -->  
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800"> Super Marché Moderne</h1>
            <p class="text-gray-500 mt-2"> Espace Administrateur</p>
        </div>
        <div class="bg-white shadow-lg rounded-xl p-8">
            <h2 class="text-2xl font-bold text-center mb-6">
                Connexion
            </h2>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="bg-red-100 border border-red-300 text-red-700 p-3 rounded mb-4">
                {{message}}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="post" action="/login">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2"> Nom d'utilisateur</label>
                    <input type="text" name="username" required class="w-full
                     px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Entrer votre nom d'utilisateur">
                </div>
                 <div class="mb-6">
                    <label class="block text-gray-700 mb-2"> Mot de passe </label>
                    <input type="password" name="password" required class="w-full
                     px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Entrer votre mot de passe">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg mb-4
                hover:bg-blue-700 transition"  onclick="login()"> Se connecter</button>
                 <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg
                hover:bg-blue-700 transition"  onclick="logout()"> Déconnexion</button>
            </form>

        </div>
        <p class="text-center text-gray-500 text-sm mt-4"> 2026 Super Marché Moderne</p>
    </div>
</body>
