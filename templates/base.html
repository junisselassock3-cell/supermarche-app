<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supermarché - Gestion Produits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lien vers le JS externe -->  
</head> 
<body class="bg-gray-100 font-sans">
     <!-- Header -->
      <header class="bg-green-600 text-white p-4 shadow">
        <h1 class="text-2xl font-bold">🛒 Gestion Supermarché</h1>
        <p class="mb-4"> {{admin.username}}</p>
        <a href="/dashboard" class="block py-2 hover:bg-gray-700 px-2 rounded">Dashboard</a>
        <a href="/produits" class="block py-2 hover:bg-gray-700 px-2 rounded">Produits</a>
        <a href="/ventes" class="block py-2 hover:bg-gray-700 px-2 rounded">Ventes</a>
          <a href="/logout" class="block py-2 hover:bg-gray-700 px-2 rounded text-red-700">Déconnexion</a>
         
      </header>
    
    <div class="p-6 w-full">
        {% block content %}
        {% endblock %}


        <div id="modalContainer" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-lg w-96 p-6">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Ajouter un produit</h2>
            <div id="modalBody" class="space-y-3"></div>
            <div class="flex justify-end mt-4">
                <button id="cancelBtn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded mr-2">Annuler</button>
                <button id="modalActionBtn" type="button" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Valider</button>
            </div>
        </div>
    </div>
    </div><div id="modalContainer" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">

        </div>
