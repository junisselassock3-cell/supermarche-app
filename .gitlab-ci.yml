# Pipeline GitLab CI : tests puis build + push de l'image sur Docker Hub
# Variables à créer dans GitLab (Settings > CI/CD > Variables) :
#   DOCKERHUB_USERNAME  et  DOCKERHUB_TOKEN (cocher "Masked")

stages:
  - test
  - build

variables:
  IMAGE: "$DOCKERHUB_USERNAME/supermarche-app"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  script:
    - pip install -r requirements-dev.txt
    - pytest -v

build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    # uniquement sur la branche principale (pas sur les merge requests)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHA"
